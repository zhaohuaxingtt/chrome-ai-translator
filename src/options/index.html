<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 实时翻译 · 设置</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #57606a;
        --border: #d0d7de;
        --panel: #f6f8fa;
        --accent: #0969da;
        --danger: #cf222e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c2128;
          --fg: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --panel: #22272e;
          --accent: #4493f8;
          --danger: #f85149;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 24px 64px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.6;
        background: var(--bg);
        color: var(--fg);
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
      }

      section {
        margin-bottom: 20px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .field {
        display: block;
        margin-bottom: 12px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      .field > span {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select {
        width: 100%;
        padding: 6px 10px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      input:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      .row input {
        flex: 1;
      }

      button {
        padding: 6px 14px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.primary {
        color: #ffffff;
        background: var(--accent);
        border-color: var(--accent);
      }

      button.danger:hover {
        color: var(--danger);
        border-color: var(--danger);
      }

      ul {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }

      li:last-child {
        border-bottom: none;
      }

      .empty {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AI 实时翻译 · 设置</h1>
      <p class="subtitle">配置你的 AI 服务、排除站点与翻译缓存</p>

      <section>
        <h2>AI 接口</h2>
        <label class="field">
          <span>接口地址（OpenAI 兼容）</span>
          <input id="baseUrl" type="text" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span>API 密钥</span>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label class="field">
          <span>模型名</span>
          <input id="model" type="text" placeholder="gpt-4o-mini" />
        </label>
      </section>

      <section>
        <h2>翻译</h2>
        <label class="field">
          <span>目标语言</span>
          <select id="targetLang"></select>
        </label>
      </section>

      <section>
        <h2>排除站点</h2>
        <div class="row">
          <input id="hostInput" type="text" placeholder="example.com" />
          <button id="addHost" type="button">添加</button>
        </div>
        <ul id="hostList"></ul>
        <p class="empty" id="hostEmpty">暂无排除站点（不填则翻译所有站点）</p>
      </section>

      <section>
        <h2>缓存</h2>
        <p class="empty">已占用：<span id="cacheSize">计算中…</span></p>
        <p style="margin-top: 8px">
          <button id="clearCache" class="danger" type="button">清空翻译缓存</button>
        </p>
      </section>

      <div class="footer">
        <button id="save" class="primary" type="button">保存设置</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
