<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 实时翻译</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #57606a;
        --border: #d0d7de;
        --accent: #0969da;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c2128;
          --fg: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --accent: #4493f8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        min-width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.6;
        background: var(--bg);
        color: var(--fg);
      }

      .title {
        margin: 0 0 16px;
        font-size: 15px;
        font-weight: 600;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .row > span {
        color: var(--muted);
        font-size: 13px;
      }

      select {
        flex: 1;
        max-width: 150px;
        padding: 4px 8px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      button {
        padding: 4px 10px;
        font: inherit;
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      button:disabled {
        color: var(--muted);
        cursor: not-allowed;
        opacity: 0.6;
      }

      .hostname {
        overflow: hidden;
        max-width: 140px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .divider {
        margin: 14px 0;
        border: none;
        border-top: 1px solid var(--border);
      }

      a {
        color: var(--accent);
        font-size: 13px;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <p class="title">AI 实时翻译</p>

    <div class="row">
      <span>目标语言</span>
      <select id="targetLang"></select>
    </div>

    <div class="row">
      <span>启用翻译</span>
      <input id="enabled" type="checkbox" />
    </div>

    <div class="row">
      <span class="hostname" id="siteLabel">当前站点</span>
      <button id="toggleSite" type="button">排除本站</button>
    </div>

    <hr class="divider" />

    <a id="openOptions" href="#">打开设置（配置 AI 接口）</a>

    <p class="hint" id="hint"></p>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
